<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>إدارة المجموعات</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#152238;--muted:#6b7280;--primary:#10264f;--gold:#c9a227;--green:#159447;--red:#d9363e;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#08152f,#183463);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #0002}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;color:#dbe4f4;margin-top:4px}
.container{max-width:1100px;margin:18px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 14px #10264f0b}
.stat{display:flex;justify-content:space-between;align-items:center}.stat b{font-size:28px}.stat span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0;position:sticky;top:68px;background:var(--bg);z-index:4;padding:4px 0}.tab,button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.tab{background:#e9edf5;color:var(--text);white-space:nowrap}.tab.active,button.primary{background:var(--primary);color:#fff}
button.gold{background:var(--gold);color:#111}button.green{background:#e7f7ee;color:var(--green)}button.red{background:#fdebed;color:var(--red)}button.ghost{background:#f0f2f6;color:var(--text)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 10px}.section-head h2{margin:0;font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.paid{background:#e7f7ee;color:var(--green)}.unpaid{background:#fdebed;color:var(--red)}.present{background:#e7f7ee;color:var(--green)}.absent{background:#fdebed;color:var(--red)}
input,select{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal>div{background:#fff;border-radius:18px;padding:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none}
.daybar{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.daybar button{background:#fff;border:1px solid var(--border)}.daybar .sel{background:var(--primary);color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted)}
.student-name{font-weight:800}.wa{color:#087f45;text-decoration:none;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
@media(max-width:600px){.brand{font-size:19px}.top button{padding:8px}.container{padding:0 10px}.card{border-radius:13px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<style>
#lockScreen{position:fixed;inset:0;background:linear-gradient(135deg,#08152f,#183463);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#lockScreen .box{background:#fff;border-radius:18px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px #0004}
#lockScreen h2{margin:0 0 6px;color:var(--primary)}
#lockScreen p{color:var(--muted);font-size:13px;margin:0 0 18px}
#lockScreen input{text-align:center;font-size:18px;letter-spacing:2px}
#lockScreen button{width:100%;margin-top:12px;padding:12px}
#lockError{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
.hidden-app{display:none}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="box">
    <h2>🔒 إدارة المجموعات</h2>
    <p>اكتب كلمة المرور للدخول</p>
    <input type="password" id="lockPass" placeholder="كلمة المرور" autofocus>
    <button class="primary" onclick="tryUnlock()">دخول</button>
    <div id="lockError"></div>
  </div>
</div>

<div id="appRoot" class="hidden-app">
<header><div class="top"><div><div class="brand">إدارة المجموعات</div><div class="sub">لوحة إدارة المجموعات والطلاب والحضور والدفع · <span id="cloudStatus">جاري الاتصال...</span></div></div><button class="gold" onclick="openGroupModal()">＋ مجموعة</button></div></header>

<main class="container">
  <div class="tabs">
    <button class="tab active" data-view="home">الرئيسية</button>
    <button class="tab" data-view="groups">المجموعات</button>
    <button class="tab" data-view="students">الطلاب</button>
    <button class="tab" data-view="search">بحث</button>
  </div>

  <div id="stats" class="grid"></div>

  <section id="view"></section>
</main>

<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<footer>بياناتك تُحفظ على Firebase ويمكن فتحها من أي جهاز.</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfcrDfmrJ1ZrUFCgCZiC9II-Hu5UNq_ek",
  authDomain: "mange-67c8b.firebaseapp.com",
  projectId: "mange-67c8b",
  storageBucket: "mange-67c8b.firebasestorage.app",
  messagingSenderId: "903011964215",
  appId: "1:903011964215:web:f346c2e7bd8fec0fd776b2",
  measurementId: "G-X4W11V2BCT"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();
const auth = firebase.auth();
const dataRef = firestore.collection("data").doc("main");
let saveChain = Promise.resolve();
let cloudReady = false;
let cloudError = "";

const SITE_PASSWORD = "Mhmd11##";
function tryUnlock(){
  const val = document.getElementById("lockPass").value;
  const errEl = document.getElementById("lockError");
  if(val === SITE_PASSWORD){
    errEl.textContent = "";
    document.getElementById("lockPass").disabled = true;
    auth.signInAnonymously().then(()=>{
      sessionStorage.setItem("gm_unlocked","1");
      document.getElementById("lockScreen").style.display = "none";

      console.error("Auth error:", err);

  } else {
    errEl.textContent = "كلمة المرور غلط.";
  }

document.getElementById("lockPass").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });

// لو المستخدم دخل الباسورد صح قبل كده في نفس الجلسة، ادخله على طول بدون ما يكتبه تاني
if(sessionStorage.getItem("gm_unlocked")==="1"){
  auth.signInAnonymously().then(()=>{
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appRoot").classList.remove("hidden-app");
  }).catch(()=>{ sessionStorage.removeItem("gm_unlocked"); });

<script>
const KEY="group_manager_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"groups":[],"students":[],"attendance":{},"payments":{},"dailyPayments":{}}');
db.dailyPayments ||= {}; db.attendance ||= {}; db.payments ||= {};
db.groups ||= []; db.students ||= [];
db.groups.forEach(g=>g.fee ||= 0);
const days=["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
let currentView="home", selectedDay=new Date().getDay(); // JS: 0 Sunday
const mapDay={0:"الأحد",1:"الإثنين",2:"الثلاثاء",3:"الأربعاء",4:"الخميس",5:"الجمعة",6:"السبت"};
if(!days.includes(mapDay[selectedDay])) selectedDay=0;
function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
  if(!cloudReady) return;
  const snapshot=JSON.parse(JSON.stringify(db));
  saveChain=saveChain.then(()=>dataRef.set(snapshot))
    .catch(err=>{
      console.error("Firestore save error:",err);
      cloudError="تعذر حفظ آخر تعديل على الإنترنت.";
      setCloudStatus();
    });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function wa(n){let x=String(n||"").replace(/\D/g,"");if(x.startsWith("0"))x="20"+x.slice(1);if(!x.startsWith("20"))x="20"+x;return "https://wa.me/"+x;}
function groupStudents(gid){return db.students.filter(s=>s.groupId===gid);}
function groupTimeForDay(g,day){return (g.dayTimes&&g.dayTimes[day])||g.time||"";}
function studentAbsencesThisMonth(sid){
 const mk=monthKey(); let count=0;
 for(const key in db.attendance){
   const date=key.split("|")[1];
   if(date && date.startsWith(mk) && db.attendance[key][sid]==="absent") count++;
 }
 return count;
}
function todayName(){return mapDay[new Date().getDay()]||"الأحد";}
function monthKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function attendanceKey(gid,date){return gid+"|"+date;}
function stats(){
 const total=db.students.length, paid=db.students.filter(s=>db.payments[s.id+"|"+monthKey()]==="paid").length;
 const today=new Date().toISOString().slice(0,10), daily=db.dailyPayments?.[today]||[];
 const collection=daily.reduce((sum,id)=>{const s=db.students.find(x=>x.id===id),g=db.groups.find(x=>x.id===s?.groupId);return sum+(Number(g?.fee)||0)},0);
 return `<div class="card stat"><div><span>إجمالي الطلاب</span><br><b>${total}</b></div><div>👥</div></div>
 <div class="card stat"><div><span>دفعوا هذا الشهر</span><br><b style="color:var(--green)">${paid}</b></div><div>💰</div></div>
 <div class="card stat"><div><span>لم يدفعوا</span><br><b style="color:var(--red)">${total-paid}</b></div><div>🔴</div></div>
 <div class="card stat"><div><span>التحصيل اليومي</span><br><b style="color:var(--gold)">${collection} جنيه</b><div class="small">${daily.length} طالب دفع اليوم</div></div><div>💵</div></div>`;
}
function renderStats(){document.getElementById("stats").innerHTML=stats();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;render();});

function setCloudStatus(){
  const el=document.getElementById("cloudStatus");
  if(!el)return;
  if(cloudError) el.textContent=cloudError;
  else if(cloudReady) el.textContent="متصل ومحفوظ على الإنترنت";
  else el.textContent="جاري الاتصال...";
}
async function loadCloudData(){
  try{
    const snap=await dataRef.get();
    const localRaw=localStorage.getItem(KEY);
    const localData=localRaw?JSON.parse(localRaw):null;
    if(snap.exists && snap.data() && Array.isArray(snap.data().groups) && Array.isArray(snap.data().students)){
      db=Object.assign(
        {groups:[],students:[],attendance:{},payments:{},dailyPayments:{}},
        snap.data()
      );
      db.dailyPayments ||= {}; db.attendance ||= {}; db.payments ||= {};
      db.groups ||= []; db.students ||= [];
      db.groups.forEach(g=>g.fee ||= 0);
      localStorage.setItem(KEY,JSON.stringify(db));
    }else{
      if(localData && Array.isArray(localData.groups) && Array.isArray(localData.students)){
        db=Object.assign({groups:[],students:[],attendance:{},payments:{},dailyPayments:{}},localData);
        db.dailyPayments ||= {}; db.attendance ||= {}; db.payments ||= {};
        db.groups ||= []; db.students ||= [];
        db.groups.forEach(g=>g.fee ||= 0);
      }
      await dataRef.set(JSON.parse(JSON.stringify(db)));
    }
    cloudReady=true;
    cloudError="";
    setCloudStatus();
    render();
  }catch(err){
    console.error("Firestore load error:",err);
    cloudReady=false;
    cloudError="تعذر الاتصال بقاعدة البيانات.";
    setCloudStatus();
    render();
  }
}
function render(){
 renderStats(); const v=document.getElementById("view");
 if(currentView==="home") home(v); if(currentView==="groups") groups(v); if(currentView==="students") students(v); if(currentView==="search") search(v);
}
function home(v){
 let day=todayName();
 v.innerHTML=`<div class="section-head"><h2>جدول الأسبوع</h2><button class="ghost" onclick="exportBackup()">نسخة احتياطية</button></div>
 <div class="daybar">${days.map(d=>`<button class="${d===day?'sel':''}" onclick="showDay('${d}')">${d}</button>`).join("")}</div>
 <div id="dayContent"></div>`;
 showDay(day);
}
function showDay(day){
 const box=document.getElementById("dayContent"); if(!box)return;
 const gs=db.groups.filter(g=>g.days.includes(day)).sort((a,b)=>groupTimeForDay(a,day).localeCompare(groupTimeForDay(b,day)));
 box.innerHTML=gs.length?gs.map(g=>`<div class="card" style="margin-bottom:10px">
 <div class="section-head" style="margin:0 0 8px"><div><b>${esc(g.name)}</b><div class="small">${esc(g.grade||"")} · ${esc(groupTimeForDay(g,day))} · ${groupStudents(g.id).length} طالب</div></div>
 <button class="primary" onclick="attendance('${g.id}','${day}')">الحضور</button></div>
 </div>`).join(""):`<div class="card empty">لا توجد مجموعات في ${day}.</div>`;
}
function groups(v){
 v.innerHTML=`<div class="section-head"><h2>المجموعات</h2><button class="primary" onclick="openGroupModal()">＋ إضافة مجموعة</button></div>
 <div class="grid">${db.groups.map(g=>`<div class="card"><b>${esc(g.name)}</b><div class="small">${esc(g.grade||"")}</div>
 <div class="small" style="margin-top:6px">${g.days.map(d=>`${esc(d)} ${esc(groupTimeForDay(g,d))}`).join(" · ")}</div>
 <p><b>${groupStudents(g.id).length}</b> طالب · 💰 ${Number(g.fee)||0} جنيه/شهر</p><div class="actions"><button class="primary" onclick="openGroup('${g.id}')">فتح المجموعة</button><button class="ghost" onclick="openGroupModal('${g.id}')">تعديل</button><button class="red" onclick="deleteGroup('${g.id}')">حذف</button></div></div>`).join("")||`<div class="card empty">لم تضف أي مجموعات بعد.</div>`}</div>`;
}
function openGroup(gid){
 const g=db.groups.find(x=>x.id===gid), ss=groupStudents(gid);
 document.getElementById("modalBody").innerHTML=`<h2>${esc(g.name)}</h2><div class="small">${esc(g.grade||"")} · الاشتراك: ${Number(g.fee)||0} جنيه شهريًا</div>
 <div class="small" style="margin:6px 0 4px">${g.days.map(d=>`${esc(d)} الساعة ${esc(groupTimeForDay(g,d))}`).join(" · ")}</div>
 <div class="actions" style="margin:14px 0"><button class="primary" onclick="openStudentModal('', '${gid}')">＋ إضافة طالب</button><button class="gold" onclick="attendance('${gid}','${g.days[0]||todayName()}')">تسجيل الحضور</button></div>
 <div class="card">${ss.length?ss.map(studentRow).join(""):`<div class="empty">لا يوجد طلاب في المجموعة بعد.</div>`}</div>`;
 document.getElementById("modal").classList.remove("hidden");
}
function students(v){
 v.innerHTML=`<div class="section-head"><h2>كل الطلاب</h2><div class="small">إضافة الطلاب تتم من داخل المجموعة</div></div>
 <div class="card">${db.students.length?db.students.map(studentRow).join(""):`<div class="empty">لا يوجد طلاب.</div>`}</div>`;
}
function studentRow(s){
 const g=db.groups.find(x=>x.id===s.groupId), p=db.payments[s.id+"|"+monthKey()]==="paid";
 const absences=studentAbsencesThisMonth(s.id), warn=absences>=3;
 return `<div class="row"><div><div class="student-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>${esc(s.name)}</span><a class="wa" href="${wa(s.phone)}" target="_blank" style="font-size:16px">💬</a><a class="wa" href="tel:${esc(s.guardian)}" style="font-size:16px;color:var(--primary)">📞</a>${warn?`<span class="badge unpaid">⚠️ غاب ${absences} حصص</span>`:""}</div><div class="small">${esc(g?.name||"بدون مجموعة")}</div></div>
 <div class="actions"><button class="badge ${p?'paid':'unpaid'}" style="border:0;cursor:pointer" onclick="togglePayment('${s.id}')">${p?'دفع':'لم يدفع'}</button><button class="ghost" onclick="openStudentModal('${s.id}')">فتح</button></div></div>`;
}
function togglePayment(sid){
 const key=sid+"|"+monthKey(),today=new Date().toISOString().slice(0,10);
 db.dailyPayments ||= {}; db.dailyPayments[today] ||= [];
 const arr=db.dailyPayments[today];
 if(db.payments[key]==="paid"){db.payments[key]="unpaid";const i=arr.indexOf(sid);if(i>=0)arr.splice(i,1)}
 else {db.payments[key]="paid";if(!arr.includes(sid))arr.push(sid)}
 save();
}
function search(v){
 v.innerHTML=`<div class="section-head"><h2>بحث عن طالب</h2></div><div class="card"><input id="q" placeholder="اكتب اسم الطالب أو رقم الهاتف..." oninput="doSearch()" autofocus></div><div id="results" style="margin-top:10px"></div>`;
}
function doSearch(){
 const q=(document.getElementById("q")?.value||"").trim().toLowerCase(), r=document.getElementById("results"); if(!r)return;
 const arr=db.students.filter(s=>(s.name+" "+s.phone+" "+s.guardian).toLowerCase().includes(q));
 r.innerHTML=q?(arr.length?`<div class="card">${arr.map(studentRow).join("")}</div>`:`<div class="card empty">لا توجد نتائج.</div>`):"";
}
function openGroupModal(id){
 const g=id?db.groups.find(x=>x.id===id):{name:"",grade:"",fee:0,days:[],dayTimes:{}};
 document.getElementById("modalBody").innerHTML=`<h2>${id?"تعديل المجموعة":"إضافة مجموعة"}</h2>
 <div class="formgrid"><div><label>اسم المجموعة</label><input id="gn" value="${esc(g.name)}"></div><div><label>الصف</label><input id="gg" value="${esc(g.grade)}"></div><div><label>الاشتراك الشهري الموحد (جنيه)</label><input id="gf" type="number" min="0" value="${Number(g.fee)||0}"></div></div>
 <label style="margin-top:14px;display:block">أيام ومواعيد المجموعة</label>
 <div class="card" style="padding:6px 14px;margin-top:6px">
 ${days.map(d=>{
   const checked=g.days&&g.days.includes(d);
   const t=(g.dayTimes&&g.dayTimes[d])||g.time||"";
   return `<div class="row" style="padding:8px 0"><label style="display:flex;align-items:center;gap:8px;flex:1;margin:0;font-size:15px;color:var(--text)"><input type="checkbox" class="dayChk" data-day="${d}" ${checked?"checked":""} onchange="toggleDayTimeInput(this)" style="width:auto"> ${d}</label><input type="time" class="dayTimeInput" data-day="${d}" value="${esc(t)}" style="max-width:130px" ${checked?"":"disabled"}></div>`;
 }).join("")}
 </div>
 <div class="actions" style="margin-top:18px"><button class="primary" onclick="saveGroup('${id||""}')">حفظ</button><button class="ghost" onclick="closeModal()">إلغاء</button></div>`;
 document.getElementById("modal").classList.remove("hidden");
}
function toggleDayTimeInput(chk){
 const day=chk.dataset.day;
 const input=document.querySelector(`#modalBody .dayTimeInput[data-day="${day}"]`);
 if(input) input.disabled=!chk.checked;
}
function saveGroup(id){
 const name=document.getElementById("gn").value.trim(),grade=document.getElementById("gg").value.trim(),fee=Number(document.getElementById("gf").value)||0;
 const chks=[...document.querySelectorAll("#modalBody .dayChk")];
 const selectedDays=[],dayTimes={};
 for(const chk of chks){
   if(chk.checked){
     const day=chk.dataset.day;
     const input=document.querySelector(`#modalBody .dayTimeInput[data-day="${day}"]`);
     const t=input?input.value:"";
     if(!t){alert("حدد ميعاد يوم "+day);return}
     selectedDays.push(day); dayTimes[day]=t;
   }
 }
 if(!name||!selectedDays.length){alert("اكتب اسم المجموعة واختر يومًا واحدًا على الأقل مع تحديد ميعاده.");return}
 if(id){let g=db.groups.find(x=>x.id===id);Object.assign(g,{name,grade,fee,days:selectedDays,dayTimes});delete g.time;}
 else db.groups.push({id:crypto.randomUUID(),name,grade,fee,days:selectedDays,dayTimes});
 closeModal();save();
}
function deleteGroup(id){if(confirm("حذف المجموعة؟ الطلاب المرتبطون بها سيظلون محفوظين بدون مجموعة.")){db.students.filter(s=>s.groupId===id).forEach(s=>s.groupId="");db.groups=db.groups.filter(g=>g.id!==id);save();}}
function openStudentModal(id,presetGroupId=""){
 const s=id?db.students.find(x=>x.id===id):{name:"",phone:"",guardian:"",groupId:presetGroupId};
 document.getElementById("modalBody").innerHTML=`<h2>${id?"بيانات الطالب":"إضافة طالب"}</h2>
 <div class="formgrid"><div><label>اسم الطالب</label><input id="sn" value="${esc(s.name)}"></div><div><label>رقم هاتف الطالب</label><input id="sp" inputmode="tel" value="${esc(s.phone)}"></div><div><label>رقم ولي الأمر</label><input id="sg" inputmode="tel" value="${esc(s.guardian)}"></div><div><label>المجموعة</label>${presetGroupId&&!id?`<input value="${esc(db.groups.find(g=>g.id===presetGroupId)?.name||"")}" disabled><input type="hidden" id="sgr" value="${presetGroupId}">`:`<select id="sgr"><option value="">بدون مجموعة</option>${db.groups.map(g=>`<option value="${g.id}" ${g.id===s.groupId?"selected":""}>${esc(g.name)}</option>`).join("")}</select>`}</div></div>
 <div class="actions" style="margin-top:18px"><button class="primary" onclick="saveStudent('${id||""}')">حفظ</button>${id?`<button class="red" onclick="deleteStudent('${id}')">حذف</button>`:""}<button class="ghost" onclick="closeModal()">إلغاء</button></div>`;
 document.getElementById("modal").classList.remove("hidden");
}
function saveStudent(id){
 const name=document.getElementById("sn").value.trim(),phone=document.getElementById("sp").value.trim(),guardian=document.getElementById("sg").value.trim(),groupId=document.getElementById("sgr").value;
 if(!name||!phone||!guardian){alert("اكتب اسم الطالب ورقم الطالب ورقم ولي الأمر.");return}
 if(id){Object.assign(db.students.find(s=>s.id===id),{name,phone,guardian,groupId});}else db.students.push({id:crypto.randomUUID(),name,phone,guardian,groupId});
 closeModal();save();
}
function deleteStudent(id){if(confirm("حذف الطالب؟")){db.students=db.students.filter(s=>s.id!==id);Object.keys(db.attendance).forEach(k=>{if(k.includes(id))delete db.attendance[k]});Object.keys(db.payments).forEach(k=>{if(k.startsWith(id+"|"))delete db.payments[k]});closeModal();save();}}
function attendance(gid,day){
 const g=db.groups.find(x=>x.id===gid), ss=groupStudents(gid), date=new Date().toISOString().slice(0,10);
 const key=attendanceKey(gid,date), existing=db.attendance[key]||{};
 document.getElementById("modalBody").innerHTML=`<h2>${esc(g.name)} — حضور ${day}</h2><div class="small">الافتراضي: حاضر. اضغط فقط على الغائب.</div>
 <div class="card" style="margin-top:10px">${ss.map(s=>{let a=existing[s.id]==="absent"?"absent":"present";return `<div class="row"><div><b>${esc(s.name)}</b><div class="small"><a class="wa" href="${wa(s.guardian)}" target="_blank">💬 ولي الأمر</a></div></div><button id="att-${s.id}" class="badge ${a}" style="border:0;cursor:pointer" onclick="toggleAttendance('${gid}','${date}','${s.id}')">${a==="absent"?"غائب ❌":"حاضر ✅"}</button></div>`}).join("")||`<div class="empty">لا يوجد طلاب في المجموعة.</div>`}</div>
 <div class="actions" style="margin-top:16px"><button class="primary" onclick="closeModal()">تم</button></div>`;
 document.getElementById("modal").classList.remove("hidden");
}
function toggleAttendance(gid,date,sid){
 const key=attendanceKey(gid,date);db.attendance[key] ||= {};
 if(db.attendance[key][sid]==="absent") delete db.attendance[key][sid]; else db.attendance[key][sid]="absent";
 save(); attendance(gid,db.groups.find(g=>g.id===gid)?.days[0]||todayName());
}
function closeModal(){document.getElementById("modal").classList.add("hidden");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function exportBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="إدارة-المجموعات-نسخة-احتياطية.json";a.click();URL.revokeObjectURL(a.href);
}
render();
setCloudStatus();
loadCloudData();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
